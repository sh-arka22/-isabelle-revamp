name: cd-main   # rolling pre-release so teammates can install the latest .vsix without building

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: cd-main
  cancel-in-progress: true

jobs:
  publish-vsix:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Update rolling `main-latest` pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release delete main-latest --yes --cleanup-tag || true
          gh release create main-latest ./*.vsix --prerelease --target "$SHA" \
            --title "main @ ${SHA::7}" --notes "Auto-built from main. Install: code --install-extension <file>.vsix"
