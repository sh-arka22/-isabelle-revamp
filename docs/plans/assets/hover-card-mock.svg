  <!-- doc -->
  <text x="26" y="118" fill="#cccccc" font-size="13.5">Sum of a geometric progression.</text>
  <rect x="26" y="130" width="128" height="20" rx="10" fill="#0e639c"/>
  <text x="90" y="144" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">from preceding text</text>

  <!-- separator -->
