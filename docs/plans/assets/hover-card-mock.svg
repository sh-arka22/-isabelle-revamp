<svg xmlns="http://www.w3.org/2000/svg" width="640" height="236" viewBox="0 0 640 236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <title>Mock of the hover card for geometric_sums as VS Code renders it (dark theme)</title>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- card -->
  <rect x="12" y="10" width="616" height="214" rx="6" fill="#252526" stroke="#454545" filter="url(#shadow)"/>

  <!-- statement block -->
