  <text x="38" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#d4d4d4">
    <tspan fill="#569cd6">lemma</tspan> <tspan fill="#dcdcaa">geometric_sums</tspan>: <tspan fill="#ce9178">"norm c &lt; 1 ⟹ (λn. c^n) sums (1 / (1 - c))"</tspan>
  </text>
  <text x="38" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#808080">  fixes c :: "'a::real_normed_field"</text>

  <!-- separator -->
