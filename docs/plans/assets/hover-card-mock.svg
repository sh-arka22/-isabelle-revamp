    fact · HOL.Series.geometric_sums · Series › Geometric series · <tspan fill="#3794ff" text-decoration="underline">Series.thy:627</tspan>
  </text>
  <text x="26" y="212" fill="#6e6e6e" font-size="11">No prover call: served from docs.jsonl. Colours and font come from the user's VS Code theme.</text>
